<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Universal AI Chat</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gemini: {
              lightBg: '#f8fafd',
              lightSurface: '#ffffff',
              lightSide: '#f0f4f9',
              darkBg: '#131314',
              darkSurface: '#1e1f20',
              darkSide: '#18191a',
              blue: '#1a73e8'
            }
          }
        }
      }
    }
  </script>

  <!-- Marked.js CDN for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* Mobile-safe dynamic viewport height setup */
    html, body {
      min-height: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Markdown Styling */
    .prose p { margin-bottom: 0.75rem; line-height: 1.6; }
    .prose p:last-child { margin-bottom: 0; }
    .prose pre {
      background-color: #1e1e1e;
      color: #d4d4d4;
      padding: 0.85rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin: 0.5rem 0;
      font-size: 0.875rem;
    }
    .prose code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.875em;
    }
    .prose :not(pre) > code {
      background-color: rgba(125, 125, 125, 0.15);
      padding: 0.15rem 0.3rem;
      border-radius: 0.25rem;
    }
    .prose ul, .prose ol { margin-left: 1.25rem; margin-bottom: 0.75rem; }
    .prose ul { list-style-type: disc; }
    .prose ol { list-style-type: decimal; }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(150, 150, 150, 0.5); }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-gemini-lightBg dark:bg-gemini-darkBg text-gray-800 dark:text-gray-200 antialiased flex flex-col">

  <!-- Fallback loader to prevent blank screen issues -->
  <div id="loading" class="fixed inset-0 z-50 flex items-center justify-center bg-white dark:bg-gemini-darkBg text-lg font-medium text-gray-600 dark:text-gray-300">
    <div class="flex items-center gap-3">
      <svg class="animate-spin h-6 w-6 text-gemini-blue" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
      <span>Initializing Chat...</span>
    </div>
  </div>

  <!-- App Root Shell -->
  <div id="app" class="relative flex-1 flex flex-col md:flex-row w-full h-[100dvh] overflow-hidden opacity-0 transition-opacity duration-300">

    <!-- Mobile Top Navigation Bar -->
    <div class="md:hidden flex items-center justify-between px-4 py-3 bg-gemini-lightSurface dark:bg-gemini-darkSurface border-b border-gray-200 dark:border-gray-800 z-20 shrink-0">
      <button id="mobileMenuBtn" aria-label="Toggle Sidebar" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <div id="mobileChatTitle" class="font-medium text-sm truncate max-w-[200px]">New Chat</div>
      <button id="mobileSettingsBtn" aria-label="Open Settings" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </button>
    </div>

    <!-- Backdrop overlay for mobile sidebar -->
